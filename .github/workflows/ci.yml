name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
  isolation:
    name: Required Linux isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap python3 libseccomp2
      # Disposable hosted CI runner only. Never apply this to an agentd host.
      - name: Permit user namespaces on the ephemeral CI runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: node scripts/test-isolation-ci.mjs
